version: '3.8'

services:
  authority:
    build:
      context: .
      dockerfile: Dockerfile.authority
    container_name: mininet-wifi-authority
    ports:
      - "8080:8080"
      - "12345:12345"
    environment:
      - AUTHORITY_HOST=0.0.0.0
      - AUTHORITY_PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - mininet-network
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: mininet-wifi-client
    ports:
      - "8081:8081"
    environment:
      - CLIENT_HOST=0.0.0.0
      - CLIENT_PORT=8081
      - AUTHORITY_URL=http://authority:8080
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - mininet-network
    restart: unless-stopped
    depends_on:
      - authority
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: mininet-wifi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mininet-network
    restart: unless-stopped

networks:
  mininet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data: